# Local website_creator stack: Postgres 16, MinIO, and the app image.
# Elastic Beanstalk still builds Dockerfile with no Compose target, so the
# last stage of that file stays the production image.
#
# From the repo root (PowerShell, cmd, or Git Bash):
#   docker compose up --build
#   npm run docker:up
#
# Requires Docker Compose v2.24 or newer (Docker Desktop 4.28+).

name: website-creator

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: website_creator
      POSTGRES_PASSWORD: website_creator
      POSTGRES_DB: website_creator
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U website_creator -d website_creator"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio:
    # Community MinIO images are published on Quay, not Docker Hub.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: ["mc alias set local http://minio:9000 minioadmin minioadmin && mc mb --ignore-existing local/website-creator-local"]
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - aws/env/docker.env.example
      - path: aws/env/docker.env
        required: false
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
